<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable App - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-xl p-8 max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Timetable App</h1>
            <p class="text-gray-600">Create and manage your personalized timetables</p>
        </div>
        
        <div class="space-y-6">
            <div class="text-center">
                <div id="g_id_onload"
                     data-client_id="897054939253-318fpnpmp02vp2b8ffh1bodi2n83hf4g.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="rectangular"
                     data-theme="outline"
                     data-text="signin_with"
                     data-size="large"
                     data-logo_alignment="left">
                </div>
            </div>
            
            <div class="text-center text-sm text-gray-500">
                <p>Sign in with Google to access your timetables</p>
            </div>
        </div>
        
        <div class="mt-8 text-center">
            <div class="flex items-center justify-center space-x-4 text-sm text-gray-500">
                <span>✨ Auto-save</span>
                <span>🔄 Sync across devices</span>
                <span>🎨 Customizable</span>
            </div>
        </div>
    </div>

    <script>
        // Replace with your actual Google Client ID
        const GOOGLE_CLIENT_ID = '897054939253-318fpnpmp02vp2b8ffh1bodi2n83hf4g.apps.googleusercontent.com';
        
        // Update the data-client_id attribute (already set in HTML above)
        // document.getElementById('g_id_onload').setAttribute('data-client_id', GOOGLE_CLIENT_ID);
        
        function handleCredentialResponse(response) {
            // Send the ID token to your backend
            fetch('/auth/google', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    idtoken: response.credential
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    alert('Authentication failed: ' + (data.error || 'Unknown error'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Authentication failed');
            });
        }
    </script>
</body>
</html>
